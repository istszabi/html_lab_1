<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="components.css">
</head>

<body>

    <header>
        <h1>Kapcsolat</h1>
        <nav>
            <ul>
                <li><a href="index.html">Főoldal</a></li>
                <li><a href="rolam.html">Rólam</a></li>
                <li><a href="projektek.html">Projektek</a></li>
                <li><a href="kapcsolat.html">Kapcsolat</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Jól látható visszalépő gomb -->
        <div style="margin: 20px 0;">
            <a href="index.html"
                style="display: inline-block; background-color: #2563eb; color: white; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: bold;">
                &larr; Vissza a főoldalra
            </a>
        </div>

        <section>
            <h2>Írj üzenetet</h2>
            <form action="#" method="post">
                <div>
                    <label for="nev">Név:</label><br>
                    <input type="text" id="nev" name="nev" placeholder="Add meg a neved" required>
                </div>
                <br>
                <div>
                    <label for="email">E-mail cím:</label><br>
                    <input type="email" id="email" name="email" placeholder="pelda@email.com" required>
                </div>
                <br>
                <div>
                    <label for="uzenet">Üzenet:</label><br>
                    <textarea id="uzenet" name="uzenet" rows="5" cols="35" placeholder="Írd ide az üzenetet..."
                        required></textarea>
                </div>
                <br>
                <button type="submit">Küldés</button>
            </form>
        </section>
    </main>

    <footer>
        <hr>
        <p><strong>Kapcsolat:</strong> hallgato@egyetem.hu</p>
        <p>&copy; 2026 Minden jog fenntartva.</p>
    </footer>

</body>
